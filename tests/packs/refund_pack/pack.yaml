# Reference pack used by the phase-1 tests. It is the DESIGN.md section 6.4 refund workflow,
# plus the root and verify_identity graphs it needs, so the validator is exercised against the
# design's own example rather than against toys.
id: refund-pack
version: 0.1.0
core: ">=0.0.1,<1"
entry_graph: root
language: en
channels: [web_chat]
llm:
  default_model: claude-sonnet-5
  escalation_model: claude-opus-5
interrupts:
  allowed_from: [root, refund]
  blocked_in: [verify_identity]
handoff:
  queue: billing-tier-1
  sla_minutes: 30
limits:
  max_nodes_per_turn: 25
  max_tool_calls_per_turn: 10
  max_llm_cost_per_conversation_usd: 2.00

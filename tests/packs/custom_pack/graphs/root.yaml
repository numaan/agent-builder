id: root
description: Run the scenario named by the conversation context.
outputs:
  outcome: str | None
state:
  outcome: str | None
  detail: str | None
  reached: bool | None
start: pick
nodes:
  pick:
    type: router
    edges:
      ctx.customer.attributes.mode == 'timer': timer_wait
      ctx.customer.attributes.mode == 'human': human_wait
      ctx.customer.attributes.mode == 'error': explode
      ctx.customer.attributes.mode == 'crash': crash_hard
      ctx.customer.attributes.mode == 'error_routed': explode_routed
      ctx.customer.attributes.mode == 'gate': gated_call
      ctx.customer.attributes.mode == 'gate_loop': gated_loop_call
      ctx.customer.attributes.mode == 'retry': retry_boom
    default: tool_wait

  tool_wait:
    type: wait
    status: waiting_async_tool
    next: report

  timer_wait:
    type: wait
    status: waiting_timer
    next: report

  human_wait:
    type: wait
    status: waiting_human
    next: report

  crash_hard:
    type: crash
    next: report

  explode:
    type: boom
    next: report

  explode_routed:
    type: boom
    on_error: recovered
    next: report

  gated_call:
    type: subgraph
    graph: gated
    outputs: { reached: reached }
    next: report

  gated_loop_call:
    type: subgraph
    graph: gated_loop
    outputs: { reached: reached }
    next: report

  retry_boom:
    type: boom
    description: >
      A node whose on_error edge leads back to it through a suspending node - the shape phase 4's
      resolution left open, where each failure is a fresh attempt and, for a side-effecting tool,
      a repeated side effect. `limits.max_node_errors` is what stops it.
    on_error: retry_ask
    next: report

  retry_ask:
    type: ask
    slots: [detail]
    prompt: That did not work. Shall I try again?
    next: retry_boom

  recovered:
    type: say
    message: Recovered.
    next: finish

  report:
    type: say
    message: Done with {{ state.detail | default('nothing') }}.
    next: finish

  finish:
    type: end
    outputs: { outcome: state.detail }

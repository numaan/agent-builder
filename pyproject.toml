[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "support-core"
version = "0.0.1"
description = "Reusable library for running graph-driven customer support conversations (DESIGN.md)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Numaan", email = "Numaan.shareef@gmail.com" }]
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "alembic>=1.13",
  "anthropic>=0.40",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "jinja2>=3.1",
  "mcp>=1.0",
  "pyyaml>=6.0",
  "click>=8.1",
  "packaging>=24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "httpx>=0.27",
]

[project.scripts]
support = "support_core.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["support_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
# *.md: ruff would reformat the Python snippets inside DESIGN.md, which is a document, not code.
extend-exclude = [".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"support_core/storage/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["support_core", "tests", "packs"]
# Name modules by their path from the repo root (packs.acme_billing.tools), so a second
# pack's tools/__init__.py is not a duplicate top-level module named `tools`.
explicit_package_bases = true
exclude = ['\.venv']

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:support_core.*"]


name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ruff, mypy, pytest, pack validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        # Same image as docker-compose.yml so local and CI schemas cannot diverge.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      SUPPORT_DATABASE_URL: postgresql+asyncpg://support:support@localhost:5432/support
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        run: python -m pytest -v

      - name: Pack validate (phase 0 exit criterion)
        run: support pack validate packs/acme_billing

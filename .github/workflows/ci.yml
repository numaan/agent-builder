name: CI

on:
  push:
    # The repository branch is `master`; `main` is listed so a later rename does not silently
    # turn CI off again. Feature branches are covered by `pull_request`, so `push` is not
    # widened to every branch (that would run each PR twice).
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: ruff, mypy, pytest, pack validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        # Same image as docker-compose.yml so local and CI schemas cannot diverge.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          # CI gets a throwaway database whose name ends in `_test`, which is what
          # tests/conftest.py requires before it rebuilds the schema (README "Checks").
          POSTGRES_DB: support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      qdrant:
        # The vector side of the knowledge layer (DESIGN.md 9.1, BACKLOG.md phase 5). Same image
        # as docker-compose.yml. No health check: the image carries neither curl nor wget, and
        # `docker run --health-cmd` has no shell of its own to fall back on, so the wait is done
        # in a step below instead of being silently skipped here.
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      SUPPORT_DATABASE_URL: postgresql+asyncpg://support:support@localhost:5432/support_test
      SUPPORT_QDRANT_URL: http://localhost:6333
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Wait for Qdrant
        # The knowledge tests skip themselves when Qdrant is unreachable, which is right for a
        # developer's machine and wrong here: a CI run that silently skipped the whole vector
        # side would look identical to one that passed it. So CI waits, and fails if it never
        # comes up, which turns a skipped suite into a red build.
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:6333/readyz >/dev/null 2>&1; then
              echo "Qdrant is ready."; exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready." >&2; exit 1

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        run: python -m pytest -v

      - name: Durability and concurrency proofs (phase 2 resolution)
        # Not collected by a plain `pytest` run: it is slow (a 28-case crash matrix over a
        # suspend-and-resume conversation, plus five-process and ten-coroutine contention) and
        # every case duplicates work the default suite already covers more cheaply. Running it
        # here is what stops it rotting - see reviews/phase-2.md "Resolution".
        run: python -m pytest tests/verify_phase_2_resolution.py -v

      - name: Alembic check (models and migrations agree)
        run: python -m alembic upgrade head && python -m alembic check

      - name: Pack validate (phase 0 exit criterion)
        run: support pack validate packs/acme_billing

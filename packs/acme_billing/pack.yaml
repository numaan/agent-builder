# Acme Billing domain pack manifest (DESIGN.md section 5.1).
# `core` is pinned to the pre-1.0 development series of support-core for now; the design's
# example (">=1.4,<2") applies once core reaches its first stable release.
id: acme-billing
version: 0.1.0
core: ">=0.0.1,<1"
entry_graph: root
language: en
channels: [web_chat, email]
llm:
  default_model: claude-sonnet-5
  escalation_model: claude-opus-5     # used for handoff summaries and hard reasoning nodes
  confidence_threshold: 0.45          # below this, `classify` takes its `unclear` edge (11.3)
  max_tool_iterations: 5              # DESIGN.md 8.4's bounded read-only loop
  retries: 2                          # attempts per model before the escalation rung (7.3)
  prompt_budget:                      # per-layer token budgets (DESIGN.md 10); the rest default
    persona: 600
    policies: 1200
    conversation: 3000
interrupts:
  # DESIGN.md 6.6. A customer who changes the subject inside refund or update_address has the
  # workflow parked and offered back afterwards; inside verify_identity they are told it will be
  # picked up later and the request is recorded for the root graph (6.6 step 5, 19 step 8).
  # `root` is listed because the design's own example lists it; the engine never parks the root
  # frame, since root.yaml's classify node already handles a topic change and offering "shall we
  # go back to: is there anything else?" would be absurd. `payment_capture` is gone: this pack
  # has no such graph, and naming one it does not define was a validator warning that hid
  # nothing but taught nobody either.
  allowed_from: [root, refund, update_address]
  blocked_in: [verify_identity]
handoff:
  queue: billing-tier-1
  sla_minutes: 30
limits:
  max_nodes_per_turn: 25
  max_tool_calls_per_turn: 10
  max_llm_cost_per_conversation_usd: 2.00
memory:
  summarize_every_turns: 2            # DESIGN.md 10's rolling summary, every K turns
  window_messages: 10
  max_summary_chars: 600

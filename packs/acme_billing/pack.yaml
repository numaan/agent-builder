# Acme Billing domain pack manifest (DESIGN.md section 5.1).
# `core` is pinned to the pre-1.0 development series of support-core for now; the design's
# example (">=1.4,<2") applies once core reaches its first stable release.
id: acme-billing
version: 0.1.0
core: ">=0.0.1,<1"
entry_graph: root
language: en
channels: [web_chat, email]
llm:
  default_model: claude-sonnet-5
  escalation_model: claude-opus-5     # used for handoff summaries and hard reasoning nodes
  confidence_threshold: 0.45          # below this, `classify` takes its `unclear` edge (11.3)
  max_tool_iterations: 5              # DESIGN.md 8.4's bounded read-only loop
  retries: 2                          # attempts per model before the escalation rung (7.3)
  prompt_budget:                      # per-layer token budgets (DESIGN.md 10); the rest default
    persona: 600
    policies: 1200
    conversation: 3000
interrupts:
  # DESIGN.md 6.6. A customer who changes the subject inside refund or update_address has the
  # workflow parked and offered back afterwards; inside verify_identity they are told it will be
  # picked up later and the request is recorded for the root graph (6.6 step 5, 19 step 8).
  # `root` is listed because the design's own example lists it; the engine never parks the root
  # frame, since root.yaml's classify node already handles a topic change and offering "shall we
  # go back to: is there anything else?" would be absurd. `payment_capture` is gone: this pack
  # has no such graph, and naming one it does not define was a validator warning that hid
  # nothing but taught nobody either.
  allowed_from: [root, refund, update_address]
  blocked_in: [verify_identity]
handoff:
  queue: billing-tier-1
  sla_minutes: 30
limits:
  max_nodes_per_turn: 25
  max_tool_calls_per_turn: 10
  max_llm_cost_per_conversation_usd: 2.00
memory:
  summarize_every_turns: 2            # DESIGN.md 10's rolling summary, every K turns
  window_messages: 10
  max_summary_chars: 600
guardrails:
  # DESIGN.md 14's "pack-supplied configuration". Written out although `enabled: true` is the
  # default, because the point of the key is that a reader of the pack can see which guardrails
  # are running: `explain_denial` and `tell_done` both make claims a customer will act on, and
  # both are refused and re-prompted if they cite nothing.
  citations:
    enabled: true
ui:
  # DESIGN.md 12's "own front end", shipped in the bundle. `dir` (static assets) is served at
  # `/app` when serve_client is on; the rest is branding the front end reads from the AG-UI info
  # endpoint, so a pack can be themed with no assets at all.
  title: Acme Billing
  subtitle: Customer support
  accent: "#1f6feb"
  dir: ui
  suggestions:
    - "I got charged twice for the Pro Plan this month; can I have one of them back?"
    - "The code is 581139. Also, can you change my address while we are at it?"
    - "Yes please, go ahead and refund it."
    - "Yes please - it is 4 Elm Row, Edinburgh, EH7 4AH, United Kingdom."
    - "Why was I charged 40 dollars on the 3rd?"
  forms:
    # DESIGN.md 12's generative UI. When the update_address graph reaches `confirm_change`, the
    # AG-UI transport renders this instead of asking for a free-text yes: a review the customer
    # edits and confirms. A client with no form support still answers the same gate with text.
    confirm_change:
      title: Confirm your new billing address
      intro: Check the address before we save it - this is exactly what will go on the account.
      submit_label: Save this address
      sections:
        - title: New address
          fields:
            - key: line1
              label: Address line 1
              type: text
              required: true
            - key: line2
              label: Address line 2
              type: text
            - key: city
              label: City
              type: text
              required: true
            - key: postcode
              label: Postcode
              type: text
              required: true
              pattern: '^[A-Za-z]{1,2}\d[A-Za-z\d]? ?\d[A-Za-z]{2}$'
              hint: 'UK format, for example EH7 4AH'
            - key: country
              label: Country
              type: select
              required: true
              options:
                - {value: GB, label: United Kingdom}
                - {value: IE, label: Ireland}
                - {value: US, label: United States}
                - {value: AE, label: United Arab Emirates}
        - title: Confirmation
          fields:
            - key: authorized
              label: I confirm this address is correct and I am authorized to change it.
              type: checkbox
              required: true
